<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <g id="tick"><line x1="0" y1="0" x2="0" y2="6" /></g>
  </defs>
  <g fill="none" stroke="#0C2D4E" stroke-width="1" opacity="0.16" stroke-linecap="round" stroke-linejoin="round">
    <!-- fine grid -->
    <g stroke="#0C2D4E" stroke-width="0.6" opacity="0.3">
      <line x1="0"  y1="0" x2="0"  y2="600"/><line x1="50"  y1="0" x2="50"  y2="600"/>
      <line x1="100" y1="0" x2="100" y2="600"/><line x1="150" y1="0" x2="150" y2="600"/>
      <line x1="200" y1="0" x2="200" y2="600"/><line x1="250" y1="0" x2="250" y2="600"/>
      <line x1="300" y1="0" x2="300" y2="600"/><line x1="350" y1="0" x2="350" y2="600"/>
      <line x1="400" y1="0" x2="400" y2="600"/><line x1="450" y1="0" x2="450" y2="600"/>
      <line x1="500" y1="0" x2="500" y2="600"/><line x1="550" y1="0" x2="550" y2="600"/>
      <line x1="0" y1="0"  x2="600" y2="0"/><line x1="0" y1="50"  x2="600" y2="50"/>
      <line x1="0" y1="100" x2="600" y2="100"/><line x1="0" y1="150" x2="600" y2="150"/>
      <line x1="0" y1="200" x2="600" y2="200"/><line x1="0" y1="250" x2="600" y2="250"/>
      <line x1="0" y1="300" x2="600" y2="300"/><line x1="0" y1="350" x2="600" y2="350"/>
      <line x1="0" y1="400" x2="600" y2="400"/><line x1="0" y1="450" x2="600" y2="450"/>
      <line x1="0" y1="500" x2="600" y2="500"/><line x1="0" y1="550" x2="600" y2="550"/>
    </g>

    <!-- FLOOR PLAN (top-left): double-wall room with door swing + dimension line -->
    <rect x="60" y="70" width="190" height="140"/>
    <rect x="68" y="78" width="174" height="124"/>
    <!-- interior partition -->
    <line x1="160" y1="78" x2="160" y2="150"/><line x1="168" y1="78" x2="168" y2="150"/>
    <!-- door opening + swing arc -->
    <path d="M160 150 A 40 40 0 0 1 200 190"/>
    <line x1="160" y1="150" x2="160" y2="190"/>
    <!-- window marks on bottom wall -->
    <line x1="90" y1="202" x2="90" y2="210"/><line x1="130" y1="202" x2="130" y2="210"/>
    <!-- dimension line above -->
    <line x1="60" y1="48" x2="250" y2="48" stroke-width="0.8"/>
    <line x1="60" y1="44" x2="60" y2="52"/><line x1="250" y1="44" x2="250" y2="52"/>

    <!-- COLUMN GRID (center-right): circles with crosshair (structural columns) -->
    <g>
      <circle cx="420" cy="120" r="13"/><line x1="405" y1="120" x2="435" y2="120" stroke-width="0.6"/><line x1="420" y1="105" x2="420" y2="135" stroke-width="0.6"/>
      <circle cx="520" cy="120" r="13"/><line x1="505" y1="120" x2="535" y2="120" stroke-width="0.6"/><line x1="520" y1="105" x2="520" y2="135" stroke-width="0.6"/>
      <circle cx="420" cy="220" r="13"/><line x1="405" y1="220" x2="435" y2="220" stroke-width="0.6"/><line x1="420" y1="205" x2="420" y2="235" stroke-width="0.6"/>
      <circle cx="520" cy="220" r="13"/><line x1="505" y1="220" x2="535" y2="220" stroke-width="0.6"/><line x1="520" y1="205" x2="520" y2="235" stroke-width="0.6"/>
      <line x1="433" y1="120" x2="507" y2="120" stroke-dasharray="4 4" stroke-width="0.6"/>
      <line x1="420" y1="133" x2="420" y2="207" stroke-dasharray="4 4" stroke-width="0.6"/>
    </g>

    <!-- ELEVATION (bottom-left): stepped facade with hatching -->
    <path d="M70 470 L70 380 L150 380 L150 410 L240 410 L240 470 Z"/>
    <line x1="90" y1="400" x2="90" y2="470" stroke-width="0.6"/><line x1="110" y1="400" x2="110" y2="470" stroke-width="0.6"/>
    <line x1="130" y1="400" x2="130" y2="470" stroke-width="0.6"/>
    <rect x="180" y="425" width="40" height="30"/>
    <line x1="200" y1="425" x2="200" y2="455" stroke-width="0.6"/>

    <!-- STAIR (bottom-right): run of treads -->
    <g stroke-width="0.9">
      <rect x="400" y="380" width="150" height="120"/>
      <line x1="400" y1="400" x2="490" y2="400"/><line x1="400" y1="420" x2="490" y2="420"/>
      <line x1="400" y1="440" x2="490" y2="440"/><line x1="400" y1="460" x2="490" y2="460"/>
      <line x1="400" y1="480" x2="490" y2="480"/>
      <line x1="490" y1="380" x2="490" y2="500"/>
      <path d="M520 385 L520 495" stroke-dasharray="5 4"/>
      <path d="M445 380 L445 360 M445 360 L438 368 M445 360 L452 368" stroke-width="0.7"/>
    </g>

    <!-- diagonal section line across center -->
    <line x1="270" y1="300" x2="380" y2="340" stroke-dasharray="6 5" stroke-width="0.7"/>
    <circle cx="270" cy="300" r="3"/><circle cx="380" cy="340" r="3"/>
  </g>
</svg>
